name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Unity EditMode + PlayMode tests
    runs-on: ubuntu-latest
    # Requires UNITY_LICENSE (+ UNITY_EMAIL/UNITY_PASSWORD or UNITY_SERIAL) repo secrets to
    # activate a Unity license in CI. Until those are set up, let this job fail without blocking
    # merges — remove continue-on-error once the license secrets exist (see SETUP.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-client-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: Library-client-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          # Both modes: the PlayMode suites are the only automated coverage of the actual saved
          # scenes and their button wiring (NavigationScenePlayModeTests, RegionMapScenePlayModeTests,
          # CharacterSelectScenePlayModeTests, DevRosterScenePlayModeTests), so EditMode alone
          # can't catch a scene that stopped matching its controllers.
          testMode: all

  server:
    name: Server lint/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # server/ is structure only (empty .gitkeep dirs); `npm test` is a stub that exits 0.
      # This becomes a real install/test once Phase 3 introduces actual dependencies.
      - run: npm install --no-audit --no-fund
        working-directory: server
      - run: npm test
        working-directory: server
